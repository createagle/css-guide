<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 14-2 (final): Text Over an Image</title>
  <style>
    /* One cell; both children are placed in it and overlap */
    .hero { display: grid; inline-size: min(560px, 100%); border-radius: 12px; overflow: clip; }
    .hero > * { grid-area: 1 / 1; }
    .hero .art { min-block-size: 220px; background: linear-gradient(160deg in oklch, oklch(75% 0.12 220), oklch(45% 0.12 280)); }
    .hero .caption {
      /* Sits at the bottom of the shared cell; if the text grows, the cell (and the image) grow with it */
      align-self: end;
      padding: 40px 16px 16px;
      color: white;
      background: linear-gradient(to top, oklch(15% 0.03 280 / 0.8), oklch(15% 0.03 280 / 0));
    }
    .hero h2 { margin: 0 0 4px; font-size: 22px; }
    .hero p { margin: 0; font-size: 14px; }
  </style>
</head>
<body class="demo">
  <figure class="hero" style="margin: 0">
    <div class="art" role="img" aria-label="Mountains at dusk"></div>
    <figcaption class="caption">
      <h2>Night hike to the summit hut</h2>
      <p>Leave at sunset, arrive under the stars. Headlamps and warm layers are provided, and the hut keeper serves hot soup on arrival.</p>
    </figcaption>
  </figure>
</body>
</html>
