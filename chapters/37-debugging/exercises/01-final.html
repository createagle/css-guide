<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 37-1 (final): Fallbacks in the Right Order</title>
  <style>
    .hero { display: grid; place-content: center; gap: 8px; inline-size: min(480px, 100%); padding: 24px; border-radius: 16px; text-align: center; }
    .hero h1 { margin: 0; font-size: 26px; }
    .hero p { margin: 0; }
    /* The fallback first, the modern value second: browsers that understand it win */
    .hero {
      background: #2f6b4f;
      background: oklch(55% 0.17 150);
      color: white;
      color: oklch(98% 0.02 150);
      min-block-size: 50vh;
      min-block-size: 50dvh;
    }
  </style>
</head>
<body class="demo">
  <section class="hero">
    <h1>Walk the coast this weekend</h1>
    <p>Eight new routes between the harbour and the lighthouse.</p>
  </section>
</body>
</html>
