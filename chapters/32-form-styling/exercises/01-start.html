<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 32-1 (start): Custom Radio Cards</title>
  <style>
    .plans { margin: 0; padding: 0; border: 0; display: grid; gap: 10px; inline-size: min(380px, 100%); }
    .plans legend { font-weight: 600; margin-block-end: 8px; }
    .plan { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; }
    .plan strong { display: block; }
    .plan span { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body class="demo">
  <fieldset class="plans">
    <legend>Choose a plan</legend>
    <label class="plan"><input type="radio" name="plan" value="day"><span><strong>Day pass</strong>One route, offline for 24 hours</span></label>
    <label class="plan"><input type="radio" name="plan" value="month" checked><span><strong>Monthly</strong>All routes, cancel any time</span></label>
    <label class="plan"><input type="radio" name="plan" value="year"><span><strong>Yearly</strong>All routes, two months free</span></label>
  </fieldset>
</body>
</html>
