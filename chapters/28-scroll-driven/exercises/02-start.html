<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 28-2 (start): Slide In on Entry</title>
  <style>
    body.demo { display: block; }
    .list { inline-size: min(560px, 100%); margin: 0 auto; padding: 50vh 0; list-style: none; display: grid; gap: 20px; }
    .list li { padding: 24px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); }
    .list h2 { margin: 0 0 4px; font-size: 18px; }
    .list p { margin: 0; color: var(--muted); }
  </style>
</head>
<body class="demo">
  <ul class="list">
    <li><h2>Lake Loop</h2><p>Walk 1 of 7</p></li>
    <li><h2>North Ridge</h2><p>Walk 2 of 7</p></li>
    <li><h2>Old Mill</h2><p>Walk 3 of 7</p></li>
    <li><h2>Coast Path</h2><p>Walk 4 of 7</p></li>
    <li><h2>Forest Trail</h2><p>Walk 5 of 7</p></li>
    <li><h2>River Walk</h2><p>Walk 6 of 7</p></li>
    <li><h2>Castle Hill</h2><p>Walk 7 of 7</p></li>
  </ul>
</body>
</html>
