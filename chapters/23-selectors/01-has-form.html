<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../assets/style.css">
  <title>23-1 A Form Card Driven by :has()</title>
  <style>
    .stage { width: min(880px, 100%); align-items: flex-start; }
    .card { flex: 1 1 360px; display: grid; gap: 14px; padding: 20px; border: 2px solid var(--border); border-radius: 14px; background: var(--surface); transition: border-color 0.2s, box-shadow 0.2s; }
    .card fieldset { margin: 0; padding: 0; border: 0; display: grid; gap: 6px; }
    .card legend { padding: 0; margin-block-end: 6px; font-weight: 600; }
    .field { display: grid; gap: 4px; }
    .field > label { font-size: 14px; font-weight: 600; }
    .card input:not([type=radio], [type=checkbox]), .card textarea { font: inherit; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--fg); }
    .choice { display: flex; gap: 8px; align-items: center; font-size: 15px; }
    .error { display: none; margin: 0; font-size: 13px; color: var(--bad); }
    .locker, .gift-note { display: none; }
    .card button { justify-self: start; font: 600 15px system-ui, sans-serif; padding: 10px 20px; border: 0; border-radius: 10px; background: var(--accent); color: white; }
    #sent { margin: 0; font-size: 14px; color: var(--good); }

    /* The whole card reacts to what happens inside it */
    .card:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in oklch, var(--accent) 20%, transparent); }
    .card:has(:user-invalid) { border-color: var(--bad); box-shadow: 0 0 0 4px color-mix(in oklch, var(--bad) 18%, transparent); }
    /* A field shows its message only after the user has had a go at it */
    .field:has(:user-invalid) .error { display: block; }
    .field:has(:user-invalid) input { border-color: var(--bad); }
    /* Extra fields appear when the option that needs them is picked */
    .card:has(#d-locker:checked) .locker { display: grid; }
    .card:has(#gift:checked) .gift-note { display: grid; }
    /* The submit button looks quieter until every required field is valid */
    .card:has(:invalid) button { opacity: 0.6; }

    /* Without :has(), show every field so nothing is unreachable */
    @supports not selector(:has(*)) {
      .locker, .gift-note { display: grid; }
    }

    .rules { flex: 1 1 300px; }
    .rules ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
    .rules li { display: flex; gap: 8px; align-items: center; font: 13px var(--mono); padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; }
    .rules li::before { content: ""; inline-size: 10px; block-size: 10px; border-radius: 50%; background: var(--border); flex: none; }
    .rules li.on { border-color: var(--good); }
    .rules li.on::before { background: var(--good); }
  </style>
</head>
<body class="demo">
  <div class="stage">
    <form class="card" id="card">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" required autocomplete="name">
        <p class="error">Please enter your name.</p>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email">
        <p class="error">Please enter a valid email address.</p>
      </div>
      <fieldset>
        <legend>Delivery</legend>
        <label class="choice"><input type="radio" name="delivery" id="d-standard" checked> Standard (3–5 days)</label>
        <label class="choice"><input type="radio" name="delivery" id="d-express"> Express (next day)</label>
        <label class="choice"><input type="radio" name="delivery" id="d-locker"> Pick up from a locker</label>
      </fieldset>
      <div class="field locker">
        <label for="locker">Locker number</label>
        <input id="locker" name="locker" inputmode="numeric" pattern="[0-9]{4}" placeholder="4 digits">
        <p class="error">A locker number has 4 digits.</p>
      </div>
      <label class="choice"><input type="checkbox" id="gift"> This is a gift</label>
      <div class="field gift-note">
        <label for="note">Gift message</label>
        <textarea id="note" name="note" rows="2"></textarea>
      </div>
      <button type="submit">Place order</button>
      <p id="sent" role="status"></p>
    </form>
    <section class="rules" aria-labelledby="h-rules">
      <p class="label" id="h-rules">Selectors matching right now</p>
      <ul id="list"></ul>
    </section>
  </div>
  <script>
    const card = document.getElementById('card');
    const selectors = [
      '.card:focus-within',
      '.card:has(:user-invalid)',
      '.card:has(:invalid)',
      '.card:has(#d-locker:checked)',
      '.card:has(#gift:checked)'
    ];
    const list = document.getElementById('list');
    const items = selectors.map((s) => {
      const li = document.createElement('li');
      li.textContent = s;
      list.append(li);
      return li;
    });
    function update() {
      selectors.forEach((s, i) => {
        let on = false;
        try { on = card.matches(s); } catch { items[i].textContent = s + ' (unsupported)'; }
        items[i].classList.toggle('on', on);
      });
    }
    ['input', 'change', 'focusin', 'focusout', 'invalid'].forEach((t) => card.addEventListener(t, () => requestAnimationFrame(update), true));
    card.addEventListener('submit', (e) => { e.preventDefault(); document.getElementById('sent').textContent = 'Order placed. (Nothing was sent: this is a demo.)'; });
    update();
  </script>
</body>
</html>
