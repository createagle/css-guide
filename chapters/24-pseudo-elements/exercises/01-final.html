<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 24-1 (final): Numbered Steps</title>
  <style>
    .steps { inline-size: min(520px, 100%); margin: 0; padding: 0; list-style: none; counter-reset: step; }
    .steps li { display: grid; grid-template-columns: 40px 1fr; gap: 14px; align-items: start; margin-block-end: 16px; line-height: 1.5; counter-increment: step; }
    /* A display: grid item is no longer a list item, so it gets its own counter */
    .steps li::before {
      content: counter(step);
      display: grid;
      place-items: center;
      inline-size: 40px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      font-weight: 700;
    }
    .steps strong { display: block; font-size: 17px; }
    .steps p { margin: 2px 0 0; color: var(--muted); }
  </style>
</head>
<body class="demo">
  <ol class="steps">
    <li><div><strong>Soak the oats</strong><p>Cover with cold water and leave overnight.</p></div></li>
    <li><div><strong>Warm the milk</strong><p>Bring it to a simmer, but do not let it boil.</p></div></li>
    <li><div><strong>Stir in the oats</strong><p>Cook for five minutes, stirring now and then.</p></div></li>
    <li><div><strong>Serve</strong><p>Top with fruit and a spoon of honey.</p></div></li>
  </ol>
</body>
</html>
