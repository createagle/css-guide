<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 24-3 (final): Form Pseudo-elements</title>
  <style>
    form { display: grid; gap: 14px; inline-size: min(420px, 100%); }
    .field { display: grid; gap: 4px; }
    .field label { font-size: 14px; font-weight: 600; }
    .field input:not([type=file]) { font: inherit; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--fg); }
    .bio { margin: 0; line-height: 1.6; }

    /* Placeholder text: lighter than real input, but still readable */
    .field input::placeholder { color: var(--muted); font-style: italic; opacity: 1; }
    /* The button inside a file input */
    .field input[type=file]::file-selector-button {
      margin-inline-end: 12px;
      padding: 8px 14px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      font: inherit;
      cursor: pointer;
    }
    /* Selected text in the page's accent colours */
    ::selection { background: oklch(85% 0.13 85); color: oklch(20% 0.02 85); }
  </style>
</head>
<body class="demo">
  <form>
    <div class="field">
      <label for="handle">Display name</label>
      <input id="handle" placeholder="For example: Trail Runner">
    </div>
    <div class="field">
      <label for="photo">Profile photo</label>
      <input id="photo" type="file" accept="image/*">
    </div>
    <p class="bio">Select some of this text to see the selection colours. Your profile is shown next to the routes you share.</p>
  </form>
</body>
</html>
