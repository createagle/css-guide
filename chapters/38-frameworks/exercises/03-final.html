<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 38-3 (final): Two Components, One Class Name</title>
  <style>
    .card { display: grid; gap: 10px; inline-size: min(340px, 100%); padding: 16px; border: 1px solid var(--border); border-radius: 12px; }
    .card p, .alert p { margin: 0; }
    .alert { display: grid; gap: 4px; padding: 10px 12px; border-inline-start: 4px solid oklch(58% 0.2 25); border-radius: 6px; background: color-mix(in oklch, oklch(58% 0.2 25) 12%, transparent); }

    /* card.css: stop at the alert so its rule does not reach the alert's title */
    @scope (.card) to (.alert) {
      .title { margin: 0; font-size: 22px; }
    }

    /* alert.css */
    @scope (.alert) {
      .title { margin: 0; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: light-dark(oklch(50% 0.2 25), oklch(78% 0.13 25)); }
    }
  </style>
</head>
<body class="demo">
  <article class="card">
    <h2 class="title">Lake Loop</h2>
    <p>14 km around the lake, mostly flat.</p>
    <div class="alert" role="note">
      <h3 class="title">Trail closed</h3>
      <p>The north bridge is under repair until May.</p>
    </div>
  </article>
</body>
</html>
