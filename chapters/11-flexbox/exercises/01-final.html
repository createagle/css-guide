<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 11-1 (final): A Navigation Bar</title>
  <style>
    .site-nav {
      inline-size: min(720px, 100%);
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg);
      /* One row, vertically centered, with even spacing */
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .logo { font-weight: 800; font-size: 20px; color: var(--fg); text-decoration: none; }
    .links {
      margin: 0; padding: 0; list-style: none;
      display: flex;
      gap: 12px;
      /* An auto margin takes all the free space: the links and the button move to the end */
      margin-inline-start: auto;
    }
    .links a { color: var(--muted); text-decoration: none; padding: 6px 4px; }
    .links a[aria-current="page"] { color: var(--fg); font-weight: 600; }
    .cta { padding: 8px 14px; border-radius: 999px; background: var(--accent); color: white; text-decoration: none; font-size: 14px; }
  </style>
</head>
<body class="demo">
  <nav class="site-nav" aria-label="Main">
    <a class="logo" href="#">Trailhead</a>
    <ul class="links">
      <li><a href="#" aria-current="page">Trails</a></li>
      <li><a href="#">Maps</a></li>
      <li><a href="#">Guides</a></li>
    </ul>
    <a class="cta" href="#">Sign in</a>
  </nav>
</body>
</html>
