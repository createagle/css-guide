<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 18-3 (final): A Shadow When Stuck</title>
  <style>
    .scroller { inline-size: min(480px, 100%); block-size: 360px; overflow-y: auto; border: 1px solid var(--border); border-radius: 12px; }
    .bar { position: sticky; top: 0; }
    .bar-inner { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--bg); }
    .bar h2 { margin: 0; font-size: 16px; }
    .bar span { font-size: 13px; color: var(--muted); }
    .list { margin: 0; padding: 0 16px 16px; list-style: none; }
    .list li { padding: 10px 0; border-block-end: 1px solid var(--border); font-size: 14px; }
    .intro { margin: 0; padding: 16px; font-size: 14px; color: var(--muted); }
    /* Only while the bar is stuck to the top does it get a shadow */
    .bar { container-type: scroll-state; }
    .bar-inner { transition: box-shadow 0.2s; }
    @container scroll-state(stuck: top) {
      .bar-inner { box-shadow: 0 6px 12px -6px oklch(0% 0 0 / 0.35); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bar-inner { transition: none; }
    }
  </style>
</head>
<body class="demo">
  <div class="scroller" tabindex="0" aria-label="Participants">
    <p class="intro">Scroll down: the bar below sticks to the top of this box.</p>
    <div class="bar"><div class="bar-inner"><h2>Participants</h2><span>16 people</span></div></div>
    <ul class="list">
      <li>Ada</li>
      <li>Ben</li>
      <li>Chen</li>
      <li>Dara</li>
      <li>Eli</li>
      <li>Fatima</li>
      <li>Gus</li>
      <li>Hana</li>
      <li>Ivan</li>
      <li>Jun</li>
      <li>Kemi</li>
      <li>Leo</li>
      <li>Mia</li>
      <li>Noor</li>
      <li>Omar</li>
      <li>Pia</li>
    </ul>
  </div>
</body>
</html>
