<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 39-3 (start): Animate the Route Filter</title>
  <style>
    .segmented { display: inline-flex; margin: 0; padding: 3px; border: 1px solid var(--border); border-radius: 999px; font-size: 14px; }
    .segmented label { position: relative; padding: 4px 12px; border-radius: 999px; color: var(--muted); cursor: pointer; }
    .segmented input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .segmented label:has(:checked) { background: var(--accent); color: var(--bg); }
    .segmented label:has(:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
    .visually-hidden { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .routes { display: grid; gap: 16px; justify-items: center; inline-size: min(640px, 100%); }
    .routes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 9rem), 1fr)); gap: 12px; inline-size: 100%; margin: 0; padding: 0; list-style: none; }
    .route { overflow: hidden; border: 1px solid var(--border); border-radius: 12px; }
    .route .art { aspect-ratio: 16 / 9; }
    .route[data-type="lake"] .art { background: linear-gradient(160deg, oklch(80% 0.08 220), oklch(62% 0.12 240)); }
    .route[data-type="forest"] .art { background: linear-gradient(160deg, oklch(80% 0.1 140), oklch(50% 0.11 150)); }
    .route h3 { margin: 0; padding: 8px 10px; font-size: 14px; }
  </style>
</head>
<body class="demo">
  <section class="routes" aria-label="Routes">
    <fieldset class="segmented filters">
      <legend class="visually-hidden">Filter routes</legend>
      <label><input type="radio" name="filter" value="all" checked>All</label>
      <label><input type="radio" name="filter" value="lake">Lakes</label>
      <label><input type="radio" name="filter" value="forest">Forests</label>
    </fieldset>
    <ul class="routes-grid">
      <li class="route" data-type="lake"><div class="art"></div><h3>Lake Loop</h3></li>
      <li class="route" data-type="forest"><div class="art"></div><h3>Old Pine Walk</h3></li>
      <li class="route" data-type="lake"><div class="art"></div><h3>Two Tarns</h3></li>
      <li class="route" data-type="forest"><div class="art"></div><h3>Fern Gully</h3></li>
      <li class="route" data-type="lake"><div class="art"></div><h3>Mirror Pond</h3></li>
      <li class="route" data-type="forest"><div class="art"></div><h3>Beech Hollow</h3></li>
    </ul>
  </section>
  <script>
    const routes = document.querySelectorAll('.route');
    function applyFilter(type) {
      routes.forEach(r => { r.hidden = type !== 'all' && r.dataset.type !== type; });
    }
    document.querySelector('.filters').addEventListener('change', e => applyFilter(e.target.value));
  </script>
</body>
</html>
