<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 1-1 · Final: One Stylesheet</title>
  <style>
    .menu { list-style: none; padding: 0; margin: 0; width: 320px; }
    .menu li {
      display: flex;
      justify-content: space-between;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .menu .name { font-weight: 600; }
    .menu .price { color: #b45309; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="demo">
  <div class="stage">
    <ul class="menu">
      <li><span class="name">Espresso</span> <span class="price">$3.00</span></li>
      <li><span class="name">Flat white</span> <span class="price">$4.50</span></li>
      <li><span class="name">Matcha latte</span> <span class="price">$5.00</span></li>
    </ul>
  </div>
</body>
</html>
