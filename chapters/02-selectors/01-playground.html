<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../assets/style.css">
  <title>2-1 Selector Playground</title>
  <style>
    .stage { width: min(900px, 100%); }
    .stage > * { flex: 1 1 340px; }
    .query { display: flex; gap: 8px; }
    .query input { flex: 1; font: 14px var(--mono); padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--fg); }
    .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .presets button { font: 12px var(--mono); padding: 3px 8px; border: 1px solid var(--border); border-radius: 999px; background: none; color: var(--fg); cursor: pointer; }
    .presets button:hover { border-color: var(--accent); color: var(--accent); }
    #status { margin: 10px 0 6px; font-size: 14px; }
    #matches { margin: 0; padding-left: 1.2em; font: 13px/1.6 var(--mono); max-height: 220px; overflow: auto; }

    /* The sample page the selector runs against */
    .sample { font-size: 14px; }
    .sample * { margin: 4px 0; }
    .sample nav ul { display: flex; gap: 12px; padding: 0; list-style: none; }
    .sample article { border-top: 1px solid var(--border); padding-top: 6px; }
    .sample ul.todo { padding-left: 1.2em; }
    .sample form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .sample input { padding: 4px 6px; }
    /* Matched elements */
    .sample .hit { outline: 2px solid var(--accent); outline-offset: 2px; background: color-mix(in oklch, var(--accent) 18%, transparent); border-radius: 3px; }
  </style>
</head>
<body class="demo">
  <div class="stage">
    <div>
      <div class="query">
        <label class="label" for="selector" style="align-self: center; margin: 0">Selector</label>
        <input id="selector" value="article > p" spellcheck="false" autocomplete="off">
      </div>
      <div class="presets" id="presets">
        <button type="button">p</button>
        <button type="button">.lead</button>
        <button type="button">#signup</button>
        <button type="button">article p</button>
        <button type="button">article > p</button>
        <button type="button">h2 + p</button>
        <button type="button">h2 ~ p</button>
        <button type="button">a[href^="https"]</button>
        <button type="button">[aria-current]</button>
        <button type="button">li:nth-child(odd)</button>
        <button type="button">li.done</button>
        <button type="button">li:not(.done)</button>
        <button type="button">input[type="email"]:required</button>
        <button type="button">h2, button</button>
      </div>
      <p id="status" aria-live="polite"></p>
      <ol id="matches"></ol>
    </div>
    <div class="panel sample" id="sample">
      <header>
        <nav>
          <ul>
            <li><a href="/" aria-current="page">Home</a></li>
            <li><a href="/blog">Blog</a></li>
            <li><a href="https://example.com">Partner site</a></li>
          </ul>
        </nav>
      </header>
      <article>
        <h2>Weekend plan</h2>
        <p class="lead">A short list of things to finish.</p>
        <p>Start with the easy ones.</p>
        <ul class="todo">
          <li class="done">Buy groceries</li>
          <li>Fix the bike</li>
          <li class="done">Call grandma</li>
          <li>Water the plants</li>
        </ul>
        <div class="note">
          <p>Nested paragraph inside a div.</p>
        </div>
      </article>
      <form id="signup">
        <input type="email" required placeholder="you@example.com" aria-label="Email">
        <input type="text" placeholder="Name (optional)" aria-label="Name">
        <button type="submit" disabled>Subscribe</button>
      </form>
    </div>
  </div>
  <script>
    const input = document.getElementById('selector');
    const sample = document.getElementById('sample');
    const status = document.getElementById('status');
    const list = document.getElementById('matches');

    // Describe an element the way DevTools does: tag#id.class
    const describe = (el) => el.tagName.toLowerCase()
      + (el.id ? '#' + el.id : '')
      + [...el.classList].filter((c) => c !== 'hit').map((c) => '.' + c).join('')
      + (el.children.length ? '' : '  "' + (el.textContent.trim() || el.getAttribute('placeholder') || '') + '"');

    function run() {
      sample.querySelectorAll('.hit').forEach((el) => el.classList.remove('hit'));
      list.replaceChildren();
      let found;
      try {
        found = sample.querySelectorAll(input.value);
      } catch {
        status.innerHTML = '<span class="bad">Invalid selector: the browser would drop this whole rule.</span>';
        return;
      }
      status.textContent = found.length === 1 ? '1 element matches' : found.length + ' elements match';
      found.forEach((el) => {
        el.classList.add('hit');
        const li = document.createElement('li');
        li.textContent = describe(el);
        list.append(li);
      });
    }

    input.addEventListener('input', run);
    document.getElementById('presets').addEventListener('click', (event) => {
      if (event.target.tagName !== 'BUTTON') return;
      input.value = event.target.textContent;
      run();
    });
    sample.querySelector('form').addEventListener('submit', (event) => event.preventDefault());
    run();
  </script>
</body>
</html>
