<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 2-2 · Start: A Zebra-striped Table</title>
  <style>
    /* Write your rules here. Do not add classes to rows or cells. */
  </style>
</head>
<body class="demo">
  <div class="stage">
    <table class="scores">
      <caption>Spring league standings</caption>
      <thead>
        <tr><th scope="col">Team</th><th scope="col">Played</th><th scope="col">Won</th><th scope="col">Points</th></tr>
      </thead>
      <tbody>
        <tr><th scope="row">Harbor FC</th><td>12</td><td>9</td><td>29</td></tr>
        <tr><th scope="row">Riverside</th><td>12</td><td>8</td><td>26</td></tr>
        <tr><th scope="row">Old Town</th><td>12</td><td>7</td><td>23</td></tr>
        <tr><th scope="row">Northfield</th><td>12</td><td>5</td><td>17</td></tr>
        <tr><th scope="row">Hillside</th><td>12</td><td>3</td><td>11</td></tr>
        <tr><th scope="row">Lakeview</th><td>12</td><td>1</td><td>4</td></tr>
      </tbody>
    </table>
  </div>
</body>
</html>
