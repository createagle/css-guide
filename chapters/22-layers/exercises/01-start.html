<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 22-1 (start): Reset Versus Components</title>
  <style>
    /* reset.css: written years ago, with an ID to make sure it always wins */
    #page a { color: inherit; text-decoration: none; }
    #page ul { margin: 0; padding: 0; list-style: none; }

    /* components.css */
    .links { display: flex; gap: 16px; }
    .link { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
    .link:hover { text-decoration-thickness: 2px; }
  </style>
</head>
<body class="demo" id="page">
  <nav aria-label="Footer">
    <ul class="links">
      <li><a class="link" href="#">Privacy</a></li>
      <li><a class="link" href="#">Terms</a></li>
      <li><a class="link" href="#">Contact</a></li>
    </ul>
  </nav>
</body>
</html>
