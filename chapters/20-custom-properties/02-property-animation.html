<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../assets/style.css">
  <title>20-2 Animating with @property</title>
  <style>
    /* Registered: the browser knows --angle is an <angle>, so it can interpolate it */
    @property --angle {
      syntax: "<angle>";
      inherits: false;
      initial-value: 0deg;
    }
    @property --fill {
      syntax: "<percentage>";
      inherits: false;
      initial-value: 0%;
    }
    .stage { width: min(820px, 100%); }
    figure { flex: 1 1 240px; }
    figure.wide { flex-basis: 100%; }
    .ring {
      inline-size: 180px;
      aspect-ratio: 1;
      margin-inline: auto;
      border-radius: 50%;
      background: conic-gradient(from var(--angle, 0deg), oklch(70% 0.18 250), oklch(75% 0.17 160), oklch(80% 0.15 80), oklch(70% 0.18 250));
      mask: radial-gradient(circle, transparent 54%, black 55%);
    }
    /* Not registered: the browser only sees a string, so the animation can only flip between values */
    .ring.plain { --angle-plain: 0deg; background: conic-gradient(from var(--angle-plain), oklch(70% 0.18 250), oklch(75% 0.17 160), oklch(80% 0.15 80), oklch(70% 0.18 250)); }
    .playing .ring.registered { animation: spin 4s linear infinite; }
    .playing .ring.plain { animation: spin-plain 4s linear infinite; }
    @keyframes spin { to { --angle: 360deg; } }
    @keyframes spin-plain { to { --angle-plain: 360deg; } }
    /* A progress bar whose gradient stop transitions smoothly */
    .bar {
      block-size: 28px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: linear-gradient(to right, var(--accent) var(--fill), var(--surface) var(--fill));
      transition: --fill 0.6s ease;
    }
    @media (prefers-reduced-motion: reduce) { .bar { transition: none; } }
  </style>
</head>
<body class="demo">
  <div class="controls">
    <button type="button" id="play" aria-pressed="false">Play</button>
    <label class="control">--fill <input type="range" id="fill" min="0" max="100" step="5" value="30"> <output id="fill-out"></output></label>
  </div>
  <div class="stage" id="stage">
    <figure>
      <div class="ring registered" role="img" aria-label="Ring with a registered --angle"></div>
      <figcaption>@property --angle { syntax: "&lt;angle&gt;" }: turns smoothly</figcaption>
    </figure>
    <figure>
      <div class="ring plain" role="img" aria-label="Ring with an unregistered custom property"></div>
      <figcaption>Unregistered --angle-plain: jumps once at 50%</figcaption>
    </figure>
    <figure class="wide">
      <div class="bar" id="bar" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100"></div>
      <figcaption>transition: --fill 0.6s (a registered &lt;percentage&gt;)</figcaption>
    </figure>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    // Long-running animation: off by default, with a button to start and stop it
    $('play').addEventListener('click', () => {
      const on = $('stage').classList.toggle('playing');
      $('play').textContent = on ? 'Pause' : 'Play';
      $('play').setAttribute('aria-pressed', on);
    });
    function fill() {
      const v = $('fill').value;
      $('bar').style.setProperty('--fill', v + '%');
      $('bar').setAttribute('aria-valuenow', v);
      $('fill-out').textContent = v + '%';
    }
    $('fill').addEventListener('input', fill);
    fill();
  </script>
</body>
</html>
