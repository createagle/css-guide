<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 20-3 (start): A Gradient That Transitions</title>
  <style>
    .cta {
      padding: 14px 28px;
      border: 0;
      border-radius: 12px;
      color: white;
      font: 600 18px/1 system-ui, sans-serif;
      cursor: pointer;
      background: linear-gradient(135deg, oklch(60% 0.18 280), oklch(65% 0.17 220));
      /* Gradients cannot be interpolated, so this transition does nothing: the colours snap */
      transition: background 0.4s;
    }
    .cta:hover, .cta:focus-visible { background: linear-gradient(135deg, oklch(65% 0.19 340), oklch(70% 0.17 40)); }
    .cta:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body class="demo">
  <button class="cta" type="button">Start your trip</button>
</body>
</html>
