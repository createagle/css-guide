<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 13-2 (start): A Card Grid Without Media Queries</title>
  <style>
    .cards {
      inline-size: min(760px, 100%);
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .cards li { flex: 1 1 180px; padding: 16px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); }
    .cards h2 { margin: 0 0 4px; font-size: 16px; }
    .cards p { margin: 0; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body class="demo">
  <ul class="cards">
    <li><h2>North Ridge</h2><p>12 km · hard</p></li>
    <li><h2>Lake Loop</h2><p>6 km · easy</p></li>
    <li><h2>Pine Valley</h2><p>9 km · moderate</p></li>
    <li><h2>Old Mill</h2><p>4 km · easy</p></li>
    <li><h2>Eagle Rock</h2><p>15 km · hard</p></li>
  </ul>
</body>
</html>
