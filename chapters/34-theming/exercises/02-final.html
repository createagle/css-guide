<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Before the stylesheet and the first paint: apply a saved choice, if any
    try {
      const saved = localStorage.getItem('css-guide-theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 34-2 (final): Remember the Theme</title>
  <style>
    :root { color-scheme: light dark; }
    :root[data-theme="light"] { color-scheme: light; }
    :root[data-theme="dark"] { color-scheme: dark; }
    body.demo { background: Canvas; color: CanvasText; }
    .toggle { padding: 8px 16px; border: 1px solid currentColor; border-radius: 999px; background: none; color: inherit; font: inherit; }
    .note { max-inline-size: 320px; margin: 0; text-align: center; }
  </style>
</head>
<body class="demo">
  <button type="button" class="toggle" id="toggle">Switch theme</button>
  <p class="note">Switch the theme, then reload the page.</p>
  <script>
    const root = document.documentElement;
    const systemDark = matchMedia('(prefers-color-scheme: dark)');
    document.getElementById('toggle').addEventListener('click', () => {
      // Start from what is on screen now, including the system theme
      const now = root.dataset.theme || (systemDark.matches ? 'dark' : 'light');
      const next = now === 'dark' ? 'light' : 'dark';
      root.dataset.theme = next;
      try { localStorage.setItem('css-guide-theme', next); } catch (e) {}
    });
  </script>
</body>
</html>
