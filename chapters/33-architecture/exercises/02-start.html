<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 33-2 (start): Tokens for a Dark Theme</title>
  <style>
    .card { inline-size: 300px; display: grid; gap: 12px; padding: 20px; border-radius: 14px; background: oklch(97% 0.01 290); color: oklch(25% 0.02 290); border: 1px solid oklch(88% 0.04 290); }
    .card h3 { margin: 0; color: oklch(45% 0.2 290); }
    .card p { margin: 0; }
    .badge { justify-self: start; padding: 2px 10px; border-radius: 999px; background: oklch(88% 0.04 290); color: oklch(45% 0.2 290); font-size: 13px; }
    .button { justify-self: start; padding: 8px 16px; border: 0; border-radius: 8px; background: oklch(45% 0.2 290); color: oklch(97% 0.01 290); font: inherit; font-weight: 600; }
  </style>
</head>
<body class="demo">
  <article class="card">
    <span class="badge">New route</span>
    <h3>Old Mill Walk</h3>
    <p>An easy 6 km loop along the river, past the old water mill.</p>
    <button type="button" class="button">Start route</button>
  </article>
</body>
</html>
