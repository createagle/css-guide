<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 33-1 (final): Flat BEM Classes</title>
  <style>
    /* One flat class per thing: every selector has the same weight (0,1,0) */
    .nav { inline-size: 240px; padding: 12px; border: 1px solid var(--border); border-radius: 12px; }
    .nav__list { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
    .nav__link { display: flex; justify-content: space-between; padding: 8px 10px; border-radius: 8px; color: var(--fg); text-decoration: none; }
    .nav__link:hover { background: var(--surface); }
    .nav__link--active { background: var(--surface); font-weight: 600; }
    .nav__count { padding: 0 8px; border-radius: 999px; background: var(--border); font-size: 13px; }

    /* A modifier comes later in the file, so it wins by source order */
    .nav__link--upgrade { justify-content: center; margin-block-start: 8px; background: var(--accent); color: var(--bg); font-weight: 600; }
  </style>
</head>
<body class="demo">
  <nav class="nav" aria-label="Library">
    <ul class="nav__list">
      <li><a class="nav__link nav__link--active" href="#routes" aria-current="page">Routes <span class="nav__count">12</span></a></li>
      <li><a class="nav__link" href="#saved">Saved <span class="nav__count">4</span></a></li>
      <li><a class="nav__link" href="#history">History</a></li>
      <li><a class="nav__link nav__link--upgrade" href="#upgrade">Upgrade to Pro</a></li>
    </ul>
  </nav>
</body>
</html>
