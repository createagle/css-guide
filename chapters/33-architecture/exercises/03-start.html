<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 33-3 (start): Utilities That Win Without !important</title>
  <style>
    /* reset */
    h2, p { margin-block: 0 12px; }
    /* components */
    .card { inline-size: 320px; padding: 20px; border: 1px solid var(--border); border-radius: 14px; }
    .card h2 { font-size: 20px; }
    .card p { color: var(--fg); text-align: start; }
    /* utilities: meant to override anything, but they lose to .card p */
    .text-muted { color: var(--muted); }
    .text-center { text-align: center; }
    .mb-0 { margin-block-end: 0; }
  </style>
</head>
<body class="demo">
  <article class="card">
    <h2>Join the Sunday group</h2>
    <p>We meet at 9:00 by the visitor centre and walk for about three hours.</p>
    <p class="text-muted text-center mb-0">Free for members · bring water</p>
  </article>
</body>
</html>
