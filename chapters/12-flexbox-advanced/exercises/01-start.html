<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 12-1 (start): A Footer That Stays Down</title>
  <style>
    /* .app stands in for the browser window: 420px tall */
    .app {
      inline-size: min(560px, 100%);
      block-size: 420px;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: auto;
    }
    .app header, .app footer { padding: 12px 16px; background: var(--surface); }
    .app header { font-weight: 700; }
    .app main { padding: 16px; }
    .app footer { font-size: 13px; color: var(--muted); }
  </style>
</head>
<body class="demo">
  <div class="app">
    <header>Trailhead</header>
    <main><p>Only one short paragraph on this page.</p></main>
    <footer>© Trailhead · About · Contact</footer>
  </div>
</body>
</html>
