<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 26-2 (start): A Door on Its Hinges</title>
  <style>
    .room { display: grid; justify-items: center; gap: 48px; }
    .toggle { display: flex; gap: 8px; align-items: center; }
    .frame { inline-size: 160px; block-size: 240px; border: 6px solid oklch(45% 0.05 60); border-block-end: 0; background: oklch(25% 0.02 260); }
    .door {
      block-size: 100%;
      display: grid;
      align-items: center;
      justify-items: end;
      padding-inline-end: 14px;
      background: oklch(60% 0.09 60);
      transition: transform 0.6s ease-in-out;
    }
    .door::after { content: ""; inline-size: 12px; block-size: 12px; border-radius: 50%; background: oklch(80% 0.1 85); }
    .room:has(#open:checked) .door { transform: rotateY(-70deg); }
    @media (prefers-reduced-motion: reduce) { .door { transition: none; } }
  </style>
</head>
<body class="demo">
  <div class="room">
    <label class="toggle"><input type="checkbox" id="open"> Open the door</label>
    <div class="frame"><div class="door"></div></div>
  </div>
</body>
</html>
