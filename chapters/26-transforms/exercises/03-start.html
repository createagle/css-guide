<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 26-3 (start): Grow Without Pushing</title>
  <style>
    .apps { display: flex; gap: 12px; align-items: center; padding: 16px; border: 1px solid var(--border); border-radius: 16px; }
    .apps a { display: grid; place-items: center; inline-size: 48px; block-size: 48px; border-radius: 12px; color: white; font: 700 18px system-ui, sans-serif; text-decoration: none; }
    .apps a:nth-child(1) { background: oklch(60% 0.15 250); }
    .apps a:nth-child(2) { background: oklch(62% 0.15 150); }
    .apps a:nth-child(3) { background: oklch(65% 0.16 50); }
    .apps a:nth-child(4) { background: oklch(58% 0.16 320); }
    .apps a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .apps a { transition: inline-size 0.2s, block-size 0.2s; }
    /* Growing the box pushes its neighbours aside */
    .apps a:hover, .apps a:focus-visible { inline-size: 64px; block-size: 64px; }
  </style>
</head>
<body class="demo">
  <nav class="apps" aria-label="Apps">
    <a href="#" aria-label="Maps">M</a>
    <a href="#" aria-label="Routes">R</a>
    <a href="#" aria-label="Weather">W</a>
    <a href="#" aria-label="Photos">P</a>
  </nav>
</body>
</html>
