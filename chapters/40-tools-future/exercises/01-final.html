<!doctype html>
<html lang="en">
<head>

  <title>Exercise 40-1 (final): Review AI-generated     /* Reviewed: fluid width, no fixed height, theme tokens, logical properties, a visible focus ring */
    .plan {
      display: grid;
      gap: 12px;
      inline-size: min(300px, 100%);
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg);
      color: var(--fg);
    }
    .plan h3 { margin: 0; font-size: 1.5rem; }
    .plan p { margin: 0; color: var(--muted); }
    .plan button {
      justify-self: start;
      padding: 10px 20px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: var(--bg);
    }
    .plan button:hover { background: color-mix(in oklch, var(--accent) 85%, var(--fg)); }
    .plan button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }</title>
