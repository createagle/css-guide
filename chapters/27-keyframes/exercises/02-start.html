<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 27-2 (start): A Typewriter</title>
  <style>
    .type {
      inline-size: 20ch;
      font: 600 24px/1.4 ui-monospace, Menlo, Consolas, monospace;
      white-space: nowrap;
      overflow: hidden;
      border-inline-end: 3px solid var(--accent);
    }
    .type { animation: typing 2.2s linear; }
    @keyframes typing { from { inline-size: 0; } }
  </style>
</head>
<body class="demo">
  <p class="type">Find your next walk.</p>
</body>
</html>
