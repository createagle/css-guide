<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../assets/style.css">
  <title>27-2 Loading Indicators</title>
  <style>
    .stage { width: min(960px, 100%); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 16px; }
    .panel { display: grid; grid-template-rows: auto 1fr; }
    .show { display: grid; place-items: center; min-block-size: 96px; }
    .label { font-family: var(--mono); }

    /* 1. Spinner: one infinite rotation */
    .spinner { inline-size: 40px; aspect-ratio: 1; border-radius: 50%; border: 4px solid color-mix(in oklch, var(--accent) 20%, transparent); border-block-start-color: var(--accent); animation: spin 0.8s linear infinite; }
    @keyframes spin { to { rotate: 1turn; } }

    /* 2. Dots: one animation; negative delays start each dot part-way through */
    .dots { display: flex; gap: 8px; }
    .dots span { inline-size: 12px; aspect-ratio: 1; border-radius: 50%; background: var(--accent); animation: bounce 1s ease-in-out infinite; }
    .dots span:nth-child(2) { animation-delay: -0.84s; }
    .dots span:nth-child(3) { animation-delay: -0.68s; }
    @keyframes bounce { 0%, 80%, 100% { translate: 0 0; opacity: 0.4; } 40% { translate: 0 -12px; opacity: 1; } }

    /* 3. Pulse: scale and opacity together */
    .pulse { inline-size: 40px; aspect-ratio: 1; border-radius: 50%; background: var(--accent); animation: pulse 1.4s ease-out infinite; }
    @keyframes pulse { from { scale: 0.4; opacity: 1; } to { scale: 1.4; opacity: 0; } }

    /* 4. Indeterminate bar: a stripe that moves across, using translate only */
    .bar { position: relative; inline-size: 100%; block-size: 6px; border-radius: 3px; overflow: hidden; background: color-mix(in oklch, var(--accent) 20%, transparent); }
    .bar::before { content: ""; position: absolute; inset: 0; inline-size: 40%; border-radius: inherit; background: var(--accent); animation: sweep 1.2s ease-in-out infinite; }
    @keyframes sweep { from { translate: -100% 0; } to { translate: 250% 0; } }

    /* 5. Skeleton: a light band slides over placeholder blocks */
    .skeleton { position: relative; inline-size: 100%; display: grid; gap: 8px; overflow: hidden; }
    .skeleton i { block-size: 12px; border-radius: 6px; background: var(--surface); }
    .skeleton i:nth-child(2) { inline-size: 80%; }
    .skeleton i:nth-child(3) { inline-size: 60%; }
    .skeleton::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, color-mix(in oklch, var(--bg) 70%, transparent), transparent); animation: shimmer 1.5s infinite; }
    @keyframes shimmer { from { translate: -100% 0; } to { translate: 100% 0; } }

    /* 6. Two animations on one property: add keeps the element's own transform */
    .compose { display: flex; gap: 40px; }
    .compose b { inline-size: 32px; aspect-ratio: 1; border-radius: 6px; background: var(--accent); transform: rotate(45deg); animation: hop 1s ease-in-out infinite alternate; }
    .compose b.add { animation-composition: add; }
    @keyframes hop { to { transform: translateY(-20px); } }

    @media (prefers-reduced-motion: reduce) {
      /* Keep the loaders recognisable, but slower and without bouncing */
      .spinner { animation-duration: 2.4s; }
      .dots span { animation-name: fade; }
      @keyframes fade { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }
      .pulse, .compose b { animation: none; }
      .skeleton::after { animation: none; }
    }
  </style>
</head>
<body class="demo">
  <div class="stage">
    <section class="panel"><p class="label">rotate: 1turn · infinite</p><div class="show"><div class="spinner" role="status" aria-label="Loading"></div></div></section>
    <section class="panel"><p class="label">staggered negative animation-delay</p><div class="show"><div class="dots" role="status" aria-label="Loading"><span></span><span></span><span></span></div></div></section>
    <section class="panel"><p class="label">scale + opacity</p><div class="show"><div class="pulse" role="status" aria-label="Loading"></div></div></section>
    <section class="panel"><p class="label">indeterminate · translate</p><div class="show"><div class="bar" role="progressbar" aria-label="Loading"></div></div></section>
    <section class="panel"><p class="label">skeleton shimmer</p><div class="show"><div class="skeleton" aria-hidden="true"><i></i><i></i><i></i></div></div></section>
    <section class="panel"><p class="label">animation-composition: replace | add</p><div class="show"><div class="compose"><b title="replace"></b><b class="add" title="add"></b></div></div></section>
  </div>
</body>
</html>
