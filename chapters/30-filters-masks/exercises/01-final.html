<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 30-1 (final): A Frosted Header</title>
  <style>
    body.demo { display: block; padding: 0; }
    .site { position: sticky; inset-block-start: 0; z-index: 1; display: flex; justify-content: space-between; align-items: center; padding: 14px 24px; background: oklch(98% 0.01 260 / 0.6); color: oklch(20% 0.02 260); border-block-end: 1px solid oklch(80% 0.02 260 / 0.6); }
    .site h1 { margin: 0; font-size: 20px; }
    .site nav { display: flex; gap: 16px; }
    .site a { color: inherit; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; padding: 12px; }
    .gallery img { display: block; inline-size: 100%; block-size: auto; border-radius: 8px; }
    @supports (backdrop-filter: blur(1px)) {
      /* Blur and brighten whatever scrolls underneath */
      .site { backdrop-filter: blur(12px) saturate(1.6); }
    }
    @supports not (backdrop-filter: blur(1px)) {
      /* No blur available: make the bar opaque enough to read */
      .site { background: oklch(98% 0.01 260 / 0.95); }
    }
  </style>
</head>
<body class="demo">
  <header class="site">
    <h1>Lake Photos</h1>
    <nav aria-label="Main"><a href="#">Gallery</a><a href="#">Map</a><a href="#">About</a></nav>
  </header>
  <main class="gallery">
    <img src="../scene.svg" alt="" width="800" height="500">
    <img src="../scene.svg" alt="" width="800" height="500">
    <img src="../scene.svg" alt="" width="800" height="500">
    <img src="../scene.svg" alt="" width="800" height="500">
    <img src="../scene.svg" alt="" width="800" height="500">
    <img src="../scene.svg" alt="" width="800" height="500">
    <img src="../scene.svg" alt="" width="800" height="500">
    <img src="../scene.svg" alt="" width="800" height="500">
    <img src="../scene.svg" alt="" width="800" height="500">
  </main>
</body>
</html>
