<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 19-1 (final): A Fluid Heading</title>
  <style>
    .hero { inline-size: min(900px, 100%); padding: 24px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); }
    .hero p { margin: 8px 0 0; color: var(--muted); max-inline-size: 60ch; }
    /* One fluid size: 1.5rem at a 320px viewport, growing smoothly to 2.875rem at 1280px */
    .hero h1 { margin: 0; line-height: 1.1; font-size: clamp(1.5rem, 1.042rem + 2.29vi, 2.875rem); }
  </style>
</head>
<body class="demo">
  <header class="hero">
    <h1>Walks for every season</h1>
    <p>Resize the window slowly from narrow to wide and watch the size of the heading.</p>
  </header>
</body>
</html>
