<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 3-3 · Final: Let Inheritance Do the Work</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fafaf9; }
    .card { display: grid; gap: 12px; width: 300px; padding: 20px; border-radius: 12px; background: white; box-shadow: 0 4px 16px rgb(0 0 0 / .1); }
    .card h2, .card p { margin: 0; }
    .card label { display: grid; gap: 4px; }
    .card input { padding: 6px 8px; border: 1px solid #d6d3d1; border-radius: 6px; }
    .card button { padding: 8px; border: 0; border-radius: 6px; background: #b45309; }

    /* font-family and color inherit: set them once on the ancestor */
    .card { font-family: Georgia, serif; color: #44403c; }

    /* Form controls do not inherit fonts by default: ask them to */
    .card input,
    .card button { font: inherit; color: inherit; }
    .card button { color: white; }
  </style>
</head>
<body>
  <form class="card">
    <h2>Book a table</h2>
    <p>We hold tables for 15 minutes.</p>
    <label>Name <input name="name" autocomplete="name"></label>
    <label>Guests <input name="guests" type="number" min="1" max="8" value="2"></label>
    <button type="submit">Book</button>
  </form>
</body>
</html>
