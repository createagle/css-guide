<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 32-1 (final): Custom Radio Cards</title>
  <style>
    .plans { margin: 0; padding: 0; border: 0; display: grid; gap: 10px; inline-size: min(380px, 100%); }
    .plans legend { font-weight: 600; margin-block-end: 8px; }
    .plan { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; }
    .plan strong { display: block; }
    .plan span { color: var(--muted); font-size: 14px; }
    /* Draw the radio as a ring with a dot that grows in */
    .plan input {
      appearance: none;
      margin: 0;
      flex: none;
      inline-size: 1.25em;
      block-size: 1.25em;
      display: inline-grid;
      place-content: center;
      border: 2px solid var(--muted);
      border-radius: 50%;
    }
    .plan input::before {
      content: "";
      inline-size: 0.6em;
      block-size: 0.6em;
      border-radius: 50%;
      background: var(--accent);
      scale: 0;
      transition: scale 0.15s;
    }
    .plan input:checked { border-color: var(--accent); }
    .plan input:checked::before { scale: 1; }
    .plan input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    /* Highlight the whole card that holds the checked radio */
    .plan:has(:checked) { border-color: var(--accent); background: color-mix(in oklch, var(--accent) 8%, var(--bg)); }
    @media (forced-colors: active) {
      .plan input::before { background: CanvasText; }
    }
  </style>
</head>
<body class="demo">
  <fieldset class="plans">
    <legend>Choose a plan</legend>
    <label class="plan"><input type="radio" name="plan" value="day"><span><strong>Day pass</strong>One route, offline for 24 hours</span></label>
    <label class="plan"><input type="radio" name="plan" value="month" checked><span><strong>Monthly</strong>All routes, cancel any time</span></label>
    <label class="plan"><input type="radio" name="plan" value="year"><span><strong>Yearly</strong>All routes, two months free</span></label>
  </fieldset>
</body>
</html>
